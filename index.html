<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JurisQuiz</title>
  <!-- ───────────────────────────────────────────────────────────────
       MODO TESTE TEMPORÁRIO
       Este index.html redireciona direto para o app (app.html),
       pulando a página de vendas durante os testes com amigos.

       PARA REATIVAR A PROPAGANDA DEPOIS:
       restaure o conteúdo da landing page neste arquivo — ela está
       guardada intacta em landing.html (basta copiar o conteúdo de
       landing.html de volta para index.html).
       ─────────────────────────────────────────────────────────────── -->
  <meta http-equiv="refresh" content="0; url=app.html">
  <link rel="canonical" href="https://jurisquiz.com.br/app.html">
  <script>
    // Redireciona imediatamente, preservando qualquer parâmetro da URL
    window.location.replace('app.html' + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #e8c87a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .box { text-align: center; }
    .box h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    .box p { font-size: 14px; color: rgba(255,255,255,0.6); margin: 0 0 20px; }
    .box a { color: #e8c87a; }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 18px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #e8c87a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>JurisQuiz</h1>
    <p>Abrindo o aplicativo…</p>
    <p>Se não for redirecionado, <a href="app.html">clique aqui</a>.</p>
  </div>
</body>
</html>
